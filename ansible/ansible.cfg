[defaults]
# Path to your inventory file (or dynamic inventory plugin like aws_ec2.yaml)
inventory = ./ansible/aws_ec2.yaml

# Where Ansible looks for your custom roles
roles_path = ./ansible/roles

# Default SSH user and key (removes the need to repeat them in every inventory)
remote_user = ubuntu
private_key_file = ./ansible/roles/setup/files/pops.pem

# Prevents SSH from hanging on the "Are you sure you want to continue connecting?" prompt
host_key_checking = False

# Stops Ansible from cluttering your folder with .retry files on failure
retry_files_enabled = False

# Cleaner, more readable terminal output
stdout_callback = yaml

# Number of parallel hosts Ansible configures at once (default is 5)
forks = 10

[ssh_connection]
# Speeds up playbook execution significantly by reducing SSH round-trips
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s